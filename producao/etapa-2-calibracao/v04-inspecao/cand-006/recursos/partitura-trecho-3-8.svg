<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Times New Roman', serif; font-size: 20px; font-weight: bold; text-anchor: middle; fill: #111; }
      .subtitle { font-family: 'Arial', sans-serif; font-size: 12px; fill: #444; text-anchor: middle; }
      .meta { font-family: 'Arial', sans-serif; font-size: 11px; fill: #555; }
      .staff-line { stroke: #222; stroke-width: 1.2; }
      .bar-line { stroke: #222; stroke-width: 1.5; }
      .heavy-bar { stroke: #222; stroke-width: 3.5; }
      .tab-line { stroke: #777; stroke-width: 1.0; }
      .clef { font-family: 'Segoe UI Symbol', 'Times New Roman', serif; font-size: 42px; fill: #111; }
      .time-sig { font-family: 'Times New Roman', serif; font-size: 22px; font-weight: bold; fill: #111; text-anchor: middle; }
      .notehead-v1 { fill: #1a56db; }
      .notehead-v2 { fill: #c81e1e; }
      .stem-v1 { stroke: #1a56db; stroke-width: 2.0; }
      .stem-v2 { stroke: #c81e1e; stroke-width: 2.0; }
      .beam-v1 { stroke: #1a56db; stroke-width: 4.5; stroke-linecap: round; }
      .tab-text-v1 { font-family: 'Arial', sans-serif; font-size: 13px; font-weight: bold; fill: #1a56db; text-anchor: middle; }
      .tab-text-v2 { font-family: 'Arial', sans-serif; font-size: 13px; font-weight: bold; fill: #c81e1e; text-anchor: middle; }
      .rest-symbol { font-family: 'Times New Roman', serif; font-size: 22px; fill: #1a56db; text-anchor: middle; font-style: italic; }
      .measure-num { font-family: 'Arial', sans-serif; font-size: 12px; font-weight: bold; fill: #111; text-anchor: middle; }
      .legend-title { font-family: 'Arial', sans-serif; font-size: 12px; font-weight: bold; fill: #111; }
      .note-box { font-family: 'Arial', sans-serif; font-size: 10px; fill: #555; }
    </style>
  </defs>

  <!-- Fundo branco -->
  <rect width="920" height="440" fill="#ffffff"/>

  <!-- Título e Subtítulo -->
  <text x="460" y="26" class="title">Pequena Valsa (Ferdinando Carulli) — Trecho Didatico Calibrado</text>
  <text x="460" y="46" class="subtitle">Compassos 1 a 4 | Formula 3/8 | Polifonia a Duas Vozes no Violao Classico</text>

  <!-- Legenda Estrutural das Vozes (Morfologia e Cor) -->
  <rect x="50" y="58" width="820" height="24" rx="4" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="60" y="74" class="legend-title">Diferenciacao de Vozes:</text>
  <text x="210" y="74" font-family="Arial" font-size="11px" font-weight="bold" fill="#c81e1e">Voz 2 (Baixo / Polegar): Hastes para baixo (↓) e semínima pontuada</text>
  <text x="560" y="74" font-family="Arial" font-size="11px" font-weight="bold" fill="#1a56db">Voz 1 (Agudos): Hastes para cima (↑) e colcheias ligadas</text>

  <!-- Linhas da Pauta (Y: 105, 119, 133, 147, 161) -->
  <line x1="50" y1="105" x2="870" y2="105" class="staff-line" />
  <line x1="50" y1="119" x2="870" y2="119" class="staff-line" />
  <line x1="50" y1="133" x2="870" y2="133" class="staff-line" />
  <line x1="50" y1="147" x2="870" y2="147" class="staff-line" />
  <line x1="50" y1="161" x2="870" y2="161" class="staff-line" />

  <!-- Clave de Sol posicionada na 2ª linha (Y=147) -->
  <text x="58" y="152" class="clef">𝄞</text>

  <!-- Fórmula 3/8 na pauta -->
  <text x="96" y="127" class="time-sig">3</text>
  <text x="96" y="153" class="time-sig">8</text>

  <!-- Linhas da Tablatura (Y: 225, 240, 255, 270, 285, 300) -->
  <line x1="50" y1="225" x2="870" y2="225" class="tab-line" />
  <line x1="50" y1="240" x2="870" y2="240" class="tab-line" />
  <line x1="50" y1="255" x2="870" y2="255" class="tab-line" />
  <line x1="50" y1="270" x2="870" y2="270" class="tab-line" />
  <line x1="50" y1="285" x2="870" y2="285" class="tab-line" />
  <line x1="50" y1="300" x2="870" y2="300" class="tab-line" />

  <!-- Letras TAB e fórmula na tablatura -->
  <text x="58" y="245" font-family="Arial" font-size="13" font-weight="bold" fill="#666">T</text>
  <text x="58" y="265" font-family="Arial" font-size="13" font-weight="bold" fill="#666">A</text>
  <text x="58" y="285" font-family="Arial" font-size="13" font-weight="bold" fill="#666">B</text>
  <text x="86" y="255" class="time-sig">3</text>
  <text x="86" y="285" class="time-sig">8</text>

  <!-- Barras e Números de Compasso -->
  <!-- Barra inicial com repetição -->
  <line x1="120" y1="105" x2="120" y2="161" class="heavy-bar" />
  <line x1="125" y1="105" x2="125" y2="161" class="bar-line" />
  <circle cx="131" cy="126" r="2.5" fill="#222" />
  <circle cx="131" cy="140" r="2.5" fill="#222" />
  <line x1="120" y1="225" x2="120" y2="300" class="heavy-bar" />
  <line x1="125" y1="225" x2="125" y2="300" class="bar-line" />
  <circle cx="131" cy="247" r="2.5" fill="#222" />
  <circle cx="131" cy="277" r="2.5" fill="#222" />

  <!-- Número de compasso 1 -->
  <text x="145" y="97" class="measure-num">1</text>
  <text x="175" y="97" font-family="Arial" font-size="10px" font-weight="bold" fill="#666">[C]</text>

  <!-- Barra c.1 / c.2 -->
  <line x1="310" y1="105" x2="310" y2="161" class="bar-line" />
  <line x1="310" y1="225" x2="310" y2="300" class="bar-line" />
  <text x="325" y="97" class="measure-num">2</text>
  <text x="360" y="97" font-family="Arial" font-size="10px" font-weight="bold" fill="#666">[G7/D]</text>

  <!-- Barra c.2 / c.3 -->
  <line x1="495" y1="105" x2="495" y2="161" class="bar-line" />
  <line x1="495" y1="225" x2="495" y2="300" class="bar-line" />
  <text x="510" y="97" class="measure-num">3</text>
  <text x="540" y="97" font-family="Arial" font-size="10px" font-weight="bold" fill="#666">[C]</text>

  <!-- Barra c.3 / c.4 -->
  <line x1="680" y1="105" x2="680" y2="161" class="bar-line" />
  <line x1="680" y1="225" x2="680" y2="300" class="bar-line" />
  <text x="695" y="97" class="measure-num">4</text>
  <text x="745" y="97" font-family="Arial" font-size="10px" font-weight="bold" fill="#666">[Melodia Descendente]</text>

  <!-- Barra final c.4 -->
  <line x1="870" y1="105" x2="870" y2="161" class="bar-line" />
  <line x1="870" y1="225" x2="870" y2="300" class="bar-line" />

  <!-- ================= COMPASSO 1 ================= -->
  <!-- Baixo C4 escrito (Y=175 com linha suplementar) -->
  <line x1="155" y1="175" x2="179" y2="175" stroke="#222" stroke-width="1.2" />
  <ellipse cx="167" cy="175" rx="6" ry="4.5" class="notehead-v2" />
  <circle cx="176" cy="175" r="2" class="notehead-v2" />
  <line x1="161" y1="175" x2="161" y2="204" class="stem-v2" />
  <text x="167" y="290" class="tab-text-v2">3.</text>

  <!-- Voz 1: Pausa de modelagem no tempo 1 (não impressa na fonte original) -->
  <text x="167" y="137" class="rest-symbol">𝄾*</text>

  <!-- Viga dos bicordes da Voz 1 -->
  <line x1="220" y1="86" x2="270" y2="86" class="beam-v1" />

  <!-- Tempo 2: Bicorde [C5, E5] (Y=133, Y=112) -->
  <ellipse cx="220" cy="133" rx="6" ry="4.5" class="notehead-v1" />
  <ellipse cx="220" cy="112" rx="6" ry="4.5" class="notehead-v1" />
  <line x1="226" y1="133" x2="226" y2="86" class="stem-v1" />
  <text x="220" y="245" class="tab-text-v1">1</text>
  <text x="220" y="230" class="tab-text-v1">0</text>

  <!-- Tempo 3: Bicorde [C5, E5] -->
  <ellipse cx="270" cy="133" rx="6" ry="4.5" class="notehead-v1" />
  <ellipse cx="270" cy="112" rx="6" ry="4.5" class="notehead-v1" />
  <line x1="276" y1="133" x2="276" y2="86" class="stem-v1" />
  <text x="270" y="245" class="tab-text-v1">1</text>
  <text x="270" y="230" class="tab-text-v1">0</text>

  <!-- ================= COMPASSO 2 ================= -->
  <!-- Baixo D4 escrito (Y=168, abaixo da linha 1) -->
  <ellipse cx="347" cy="168" rx="6" ry="4.5" class="notehead-v2" />
  <circle cx="356" cy="168" r="2" class="notehead-v2" />
  <line x1="341" y1="168" x2="341" y2="198" class="stem-v2" />
  <text x="347" y="275" class="tab-text-v2">0.</text>

  <!-- Voz 1: Pausa de modelagem no tempo 1 -->
  <text x="347" y="137" class="rest-symbol">𝄾*</text>

  <!-- Viga dos bicordes da Voz 1 -->
  <line x1="400" y1="86" x2="450" y2="86" class="beam-v1" />

  <!-- Tempo 2: Bicorde [B4, F5] (Y=133, Y=105) -->
  <ellipse cx="400" cy="133" rx="6" ry="4.5" class="notehead-v1" />
  <ellipse cx="400" cy="105" rx="6" ry="4.5" class="notehead-v1" />
  <line x1="406" y1="133" x2="406" y2="86" class="stem-v1" />
  <text x="400" y="245" class="tab-text-v1">0</text>
  <text x="400" y="230" class="tab-text-v1">1</text>

  <!-- Tempo 3: Bicorde [B4, F5] -->
  <ellipse cx="450" cy="133" rx="6" ry="4.5" class="notehead-v1" />
  <ellipse cx="450" cy="105" rx="6" ry="4.5" class="notehead-v1" />
  <line x1="456" y1="133" x2="456" y2="86" class="stem-v1" />
  <text x="450" y="245" class="tab-text-v1">0</text>
  <text x="450" y="230" class="tab-text-v1">1</text>

  <!-- ================= COMPASSO 3 ================= -->
  <!-- Baixo C4 escrito -->
  <line x1="525" y1="175" x2="549" y2="175" stroke="#222" stroke-width="1.2" />
  <ellipse cx="537" cy="175" rx="6" ry="4.5" class="notehead-v2" />
  <circle cx="546" cy="175" r="2" class="notehead-v2" />
  <line x1="531" y1="175" x2="531" y2="204" class="stem-v2" />
  <text x="537" y="290" class="tab-text-v2">3.</text>

  <!-- Voz 1: Pausa de modelagem no tempo 1 -->
  <text x="537" y="137" class="rest-symbol">𝄾*</text>

  <!-- Viga dos bicordes da Voz 1 -->
  <line x1="590" y1="86" x2="640" y2="86" class="beam-v1" />

  <!-- Tempo 2: Bicorde [C5, E5] -->
  <ellipse cx="590" cy="133" rx="6" ry="4.5" class="notehead-v1" />
  <ellipse cx="590" cy="112" rx="6" ry="4.5" class="notehead-v1" />
  <line x1="596" y1="133" x2="596" y2="86" class="stem-v1" />
  <text x="590" y="245" class="tab-text-v1">1</text>
  <text x="590" y="230" class="tab-text-v1">0</text>

  <!-- Tempo 3: Bicorde [C5, E5] -->
  <ellipse cx="640" cy="133" rx="6" ry="4.5" class="notehead-v1" />
  <ellipse cx="640" cy="112" rx="6" ry="4.5" class="notehead-v1" />
  <line x1="646" y1="133" x2="646" y2="86" class="stem-v1" />
  <text x="640" y="245" class="tab-text-v1">1</text>
  <text x="640" y="230" class="tab-text-v1">0</text>

  <!-- ================= COMPASSO 4 ================= -->
  <!-- Voz 1: Viga da melodia descendente G5 - E5 - G4 -->
  <line x1="720" y1="74" x2="820" y2="88" class="beam-v1" />

  <!-- Tempo 1: G5 escrito (Y=98, acima da 5ª linha) -->
  <ellipse cx="720" cy="98" rx="6" ry="4.5" class="notehead-v1" />
  <line x1="726" y1="98" x2="726" y2="75" class="stem-v1" />
  <text x="720" y="230" class="tab-text-v1">3</text>

  <!-- Tempo 2: E5 escrito (Y=112, 4º espaço) -->
  <ellipse cx="770" cy="112" rx="6" ry="4.5" class="notehead-v1" />
  <line x1="776" y1="112" x2="776" y2="82" class="stem-v1" />
  <text x="770" y="230" class="tab-text-v1">0</text>

  <!-- Tempo 3: G4 escrito (Y=147, 2ª linha) -->
  <ellipse cx="820" cy="147" rx="6" ry="4.5" class="notehead-v1" />
  <line x1="826" y1="147" x2="826" y2="89" class="stem-v1" />
  <text x="820" y="260" class="tab-text-v1">0</text>

  <!-- Voz 2: Silêncio de modelagem no baixo c.4 -->
  <text x="770" y="195" font-family="Arial" font-size="11px" font-style="italic" fill="#c81e1e" text-anchor="middle">(silêncio do baixo no c.4)*</text>

  <!-- ================= NOTAS DE ESCLARECIMENTO EDITORIAL ================= -->
  <rect x="50" y="325" width="820" height="95" rx="4" fill="#fafafa" stroke="#e5e7eb"/>
  <text x="60" y="342" font-family="Arial" font-size="11px" font-weight="bold" fill="#111">Notas Explicativas de Curadoria Editorial e Transcrição:</text>
  <text x="60" y="360" class="note-box">* Pausas da Modelagem: Os símbolos de pausa (𝄾* e silêncio no baixo*) representam decisões analíticas autorais de modelagem polifônica para completar a ocupação temporal de 3 colcheias por voz. Na fonte impressa original (arq-0460), esses tempos aparecem com haste subindo ou sem ataque notado.</text>
  <text x="60" y="378" class="note-box">** Divergência da Fonte no c.4: Na fonte original arq-0460, a pauta mostra cabeças D5-B4-G4 escritos, enquanto a tablatura traz números 1ª c.3, 1ª c.0, 3ª c.0. A sequência G5-E5-G4 adotada nesta partitura e no áudio é uma escolha autoral deliberada fundamentada na tablatura da fonte.</text>
  <text x="60" y="396" class="note-box">*** Convenção Sonora: Alturas reais soam uma oitava abaixo da notação escrita em clave de Sol (ex: C4 escrito = C3 sonoro a 130,81 Hz na 5ª corda casa 3).</text>
</svg>
