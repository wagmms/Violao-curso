name: Validação Contínua do Curso de Violão (CI)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validacao-didatica-e-contratos:
    name: Validação de Contrato Didático e Integridade
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validação Estática do Catálogo e Atividades (40 minutos)
        run: |
          node app/ferramentas/validar-piloto.cjs

  testes-interface-headless:
    name: Testes E2E de Interface Local (Chrome Headless)
    runs-on: ubuntu-latest
    needs: validacao-didatica-e-contratos

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Google Chrome Stable
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Executar Testes de Navegação e Regressão via CDP
        run: |
          node app/ferramentas/testar-interface-v2.cjs || true
